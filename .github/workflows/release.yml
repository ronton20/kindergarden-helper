name: Build Windows EXE and Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          npm version "$v" --no-git-tag-version --allow-same-version

      # electron-builder does the publishing itself on a tag. It is the only
      # thing that knows the full set of files auto-update needs — the
      # installer, `latest.yml` (the manifest electron-updater reads, with the
      # sha512 it verifies the download against) and the `.blockmap` that lets
      # it fetch only the changed parts. Uploading `dist/*.exe` alone, as this
      # workflow used to, would leave the app unable to see its own releases.
      - name: Build Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            npx electron-builder --win --publish always
          else
            npx electron-builder --win --publish never
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KindergartenHelper-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      # electron-builder publishes the release but writes no notes, and names it
      # after the bare version ("2.0.1") rather than the tag ("v2.0.1"), which
      # doesn't match the releases published before it. Both are cosmetic — the
      # app updates itself and nobody has to read this page — so a failure here
      # must not fail the release.
      - name: Tidy the release — title and generated notes
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body)
          gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
